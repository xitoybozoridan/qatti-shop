<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0e0e10">
<title>qSHOP Admin</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0e0e10;--card:#17171b;--card2:#1e1e24;--line:#2a2a31;--gold:#d4af37;--gold2:#f3d77a;--text:#f3f1ea;--muted:#9a978c;--red:#ff4d4f;--green:#3ecf8e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:560px;min-height:100vh;padding-bottom:84px}
header{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.94);padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;display:grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:-.5px;flex:none}
header h1{font-size:17px;margin:0;flex:1}
header h1 small{display:block;font-size:11px;color:var(--muted);font-weight:400}
header button{background:none;border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 10px;font-size:12px;font-family:inherit}
main{padding:14px 16px}
h2{font-size:15px;margin:18px 0 10px;color:var(--gold2)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;color:#1a1405;background:linear-gradient(135deg,var(--gold2),var(--gold));width:100%;display:block;text-align:center;text-decoration:none;font-family:inherit}
.mn{display:flex;align-items:center;gap:14px;cursor:pointer;padding:14px}
.mn:active{transform:scale(.99)}
.mn .ic{font-size:28px;width:34px;text-align:center}
.mn .t{flex:1;min-width:0}
.mn .t b{display:block;font-size:15px}
.mn .go{color:var(--muted);font-size:20px}
.back{background:none;border:0;color:var(--gold2);font-size:15px;font-weight:700;padding:4px 0 10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--red);border:1px solid #4a2326}
.btn.small{padding:8px 10px;font-size:12px;width:auto;display:inline-block}
.btn:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;background:rgba(14,14,16,.97);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:30}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;position:relative;font-family:inherit}
nav button span{font-size:20px}
nav button.on{color:var(--gold2)}
nav .dot{position:absolute;top:0;right:22%;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-style:normal}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:11px 12px;font-size:15px;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus,select:focus{outline:1px solid var(--gold)}
input[type=checkbox]{width:auto;margin:0 8px 0 0;vertical-align:middle}
label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:7px 12px;font-size:12px;font-family:inherit}
.chip.on{background:#2a2208;border-color:var(--gold);color:var(--gold2)}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;border:1px solid currentColor}
.row{display:flex;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.muted{color:var(--muted);font-size:12px;line-height:1.5}
.big{font-size:22px;font-weight:800;color:var(--gold2)}
.empty{text-align:center;color:var(--muted);padding:44px 20px;font-size:14px;line-height:1.6}
.empty b{display:block;font-size:40px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.thumb{width:56px;height:56px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.modal{position:fixed;inset:0;background:var(--bg);z-index:60;overflow:auto;display:none}
.modal.show{display:block}
.modal .in{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 40px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat .muted{margin-bottom:4px}
.bar{height:8px;background:var(--card2);border-radius:6px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.login{max-width:380px;margin:0 auto;padding:60px 20px}
.login .logo{margin:0 auto 14px;width:56px;height:56px;font-size:19px;border-radius:16px}
.err{color:var(--red);font-size:13px;margin:-2px 0 10px;min-height:16px}
a{color:var(--gold2)}
.items{font-size:13px;line-height:1.5;margin:6px 0}
.days{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:8px}
.days div{flex:1;text-align:center;font-size:10px;color:var(--muted)}
.days i{display:block;background:linear-gradient(180deg,var(--gold2),var(--gold));border-radius:5px 5px 0 0;min-height:3px;margin-bottom:3px}
.ord{margin-top:10px}.ord.item{border-top:1px dashed var(--line);padding-top:8px}
.rcp{width:72px;height:72px;object-fit:cover;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.oth{width:52px;height:52px;border-radius:10px;object-fit:cover;border:1px solid var(--line);flex:none;background:var(--card2);display:grid;place-items:center;font-size:24px;cursor:pointer}
.ohead{cursor:pointer;display:flex;gap:10px;align-items:center;margin-top:8px}
.ohead .tx{flex:1;min-width:0;font-size:13px;line-height:1.4}
.ohead .tx b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ohead .ch{color:var(--muted);font-size:20px;transition:transform .15s}
.ohead .ch.up{transform:rotate(90deg)}
.rcbig{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:80;display:grid;place-items:center;padding:10px;overflow:auto}.rcbig img{max-width:100%;max-height:100%;object-fit:contain}
.kv{font-size:14px;margin-bottom:3px}.kv span{color:var(--muted)}
button,a,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal" id="modal"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script>
(function(){
  'use strict';
  var $ = function(id){ return document.getElementById(id); };
  var esc = function(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); };
  function kv(k, v){ return '<div class="kv"><span>' + esc(k) + ':</span> <b>' + esc(v) + '</b></div>'; }
  function splitOpt(n){
    n = String(n || ''); var m = n.match(/^(.*?)\s*\(([^()]*:[^()]*)\)\s*$/);
    return m ? { name: m[1], opts: m[2].split(/,\s*(?=[^,]*:)/) } : { name: n, opts: [] };
  }
  var money = function(n){ return Math.round(+n || 0).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; };
  var STATUS = { new: ['Yangi', '#ff4d4f'], confirmed: ['Tasdiqlandi', '#f3d77a'], purchased: ['Sotib olindi', '#6aa9ff'],
    shipped: ["Yo'lda", '#b48cff'], arrived: ['Keldi', '#3ecf8e'], done: ['Yakunlandi', '#3ecf8e'], cancelled: ['Bekor qilindi', '#9a978c'] };
  var sb = null;
  try { sb = window.supabase.createClient(window.QSHOP.SUPABASE_URL, window.QSHOP.SUPABASE_KEY); } catch(e){}
  var S = { oopen: {}, sub: '', coupons: [], ads: { top: [], feed: [], info: [] }, adstats: {}, _adslot: '', tab: 'orders', orders: [], products: [], shop: {}, info: {}, cats: [], pay: {}, shown: 30, cshown: 30, cq: '', copen: '', accts: [], calc: { rate: 1750, markup: 30 }, filter: 'all', editing: null, busy: false };

  function toast(t){ var el = $('toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(function(){ el.classList.remove('show'); }, 2600); }
  function fmtDate(iso){ try { return new Date(iso).toLocaleString('ru', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }); } catch(e){ return ''; } }
  function hoursLeft(iso){ return iso ? Math.ceil((new Date(iso).getTime() - Date.now()) / 3600000) : null; }
  function gm(){ return S.shop.group_mode !== false; }
  function phoneDigits(p){ var d = String(p || '').replace(/\D/g, ''); if (d.length === 9) d = '998' + d; return d; }
  function errMsg(e){ return (e && e.message) ? e.message : 'Noma\'lum xatolik'; }

  /* ---------- Kirish ---------- */
  function showLogin(msg){
    $('app').innerHTML = '<div class="login"><div class="logo">qSH</div><h1 style="text-align:center;font-size:20px;margin:0 0 4px">qSHOP Admin</h1>' +
      '<p class="muted" style="text-align:center;margin:0 0 20px">Faqat administrator uchun</p>' +
      '<label>Email</label><input id="l_email" type="email" autocomplete="username">' +
      '<label>Parol</label><input id="l_pass" type="password" autocomplete="current-password">' +
      '<div class="err" id="l_err">' + esc(msg || '') + '</div><button class="btn" id="l_go">Kirish</button></div>';
  }
  async function doLogin(){
    var email = $('l_email').value.trim(), pass = $('l_pass').value;
    if (!email || !pass) { $('l_err').textContent = 'Email va parolni kiriting'; return; }
    $('l_go').disabled = true; $('l_go').textContent = 'Kirilmoqda...';
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if (r.error) { showLogin("Email yoki parol noto'g'ri"); return; }
    await enter();
  }
  async function isAdmin(){
    try { var r = await sb.from('admins').select('user_id').maybeSingle(); return !r.error && !!r.data; } catch(e){ return false; }
  }
  async function enter(){
    if (!(await isAdmin())) { await sb.auth.signOut(); showLogin('Bu hisob admin sifatida qo\'shilmagan'); return; }
    $('app').innerHTML = '<div class="empty"><b>⏳</b>Yuklanmoqda...</div>';
    await refreshAll();
    drawShell(); render();
  }
  async function logout(){ await sb.auth.signOut(); showLogin(''); }

  /* ---------- Ma'lumot ---------- */
  async function loadOrders(){
    var r = await sb.from('orders').select('*').order('created_at', { ascending: false }).limit(200);
    if (r.error) throw r.error; S.orders = r.data || [];
  }
  async function loadProducts(){
    var r = await sb.from('products').select('*').order('sort').order('id');
    if (r.error) throw r.error; S.products = r.data || [];
  }
  async function loadSettings(){
    var r = await sb.from('settings').select('key,value');
    if (r.error) throw r.error;
    loadAdStats(); loadChatThreads().then(renderNav); loadAnns(); loadRevs(); loadCoupons().then(function(){ cpRender(); if (S.tab === 'texts' && !S.sub && $('view')) render(); });
    (r.data || []).forEach(function(x){ if (x.key === 'shop') S.shop = x.value || {}; if (x.key === 'info') S.info = x.value || {}; if (x.key === 'calc' && x.value) S.calc = { rate: +x.value.rate || 1750, markup: x.value.markup === undefined ? 30 : +x.value.markup }; if (x.key === 'pay') S.pay = x.value || {}; if (x.key === 'ads') S.ads = normAds(x.value); if (x.key === 'categories') S.cats = (x.value && x.value.list) || []; });
  }
  function sig(){ return S.orders.length + ':' + S.orders.map(function(o){ return o.id + o.status + (o.paid ? 1 : 0) + (+o.shipping || 0) + (o.receipt_thumb ? 1 : 0); }).join(',').length + ':' + (S.orders[0] ? S.orders[0].id : 0); }
  async function refreshTab(tab){
    if (tab !== 'orders' && tab !== 'stats' && tab !== 'customers') return;
    var before = sig() + '|' + S.accts.length;
    try { await loadOrders(); if (tab === 'customers') await loadAccounts(); } catch(e){ return; }
    var active = document.activeElement;
    if (S.tab !== tab || (before === sig() + '|' + S.accts.length) || $('modal').classList.contains('show') || (active && /INPUT|TEXTAREA|SELECT/.test(active.tagName))) return;
    var y = window.scrollY; render(); window.scrollTo(0, y);
  }
  async function refreshAll(){
    try { await Promise.all([loadOrders(), loadProducts(), loadSettings()]); } catch(e){ toast('Yuklashda xatolik: ' + errMsg(e)); }
  }

  /* ---------- Qobiq ---------- */
  function drawShell(){
    $('app').innerHTML = '<header><div class="logo">qSH</div><h1>qSHOP Admin<small id="sub"></small></h1><button id="refresh">⟳</button><button id="logout">Chiqish</button></header>' +
      '<main id="view"></main><nav id="nav"></nav>';
  }
  function renderNav(){
    if (!$('nav')) return;
    var news = S.orders.filter(function(o){ return o.status === 'new'; }).length;
    var items = [['orders', '📦', 'Buyurtmalar'], ['products', '🛍', 'Mahsulotlar'], ['customers', '👥', 'Mijozlar'], ['texts', '⚙️', 'Sozlamalar'], ['stats', '📊', 'Statistika']];
    $('nav').innerHTML = items.map(function(t){
      return '<button data-tab="' + t[0] + '" class="' + (S.tab === t[0] ? 'on' : '') + '">' + (t[0] === 'orders' && news ? '<em class="dot">' + news + '</em>' : '') + (t[0] === 'texts' && S.chUnread ? '<em class="dot">' + S.chUnread + '</em>' : '') + '<span>' + t[1] + '</span>' + t[2] + '</button>';
    }).join('');
    $('sub').textContent = news ? news + ' ta yangi buyurtma' : '';
  }
  function render(){
    var v = S.tab === 'orders' ? viewOrders() : S.tab === 'products' ? viewProducts() : S.tab === 'customers' ? viewCustomers() : S.tab === 'texts' ? viewTexts() : viewStats();
    $('view').innerHTML = v; renderNav();
  }

  /* ---------- Buyurtmalar ---------- */
  function prodOf(i){ return S.products.filter(function(x){ return x.id === i.id; })[0] || null; }
  function othumb(i, big){
    var p = prodOf(i), u = p && p.image_url ? p.image_url : '';
    return u ? '<img class="oth" loading="lazy" data-oimg="' + esc(u) + '" src="' + esc(u) + '" alt="">' : '<div class="oth">' + esc((p && p.emoji) || '📦') + '</div>';
  }
  function showBig(u){
    var ov = document.createElement('div'); ov.className = 'rcbig'; ov.innerHTML = '<img src="' + esc(u) + '" alt="">'; document.body.appendChild(ov);
    ov.addEventListener('click', function(){ ov.remove(); });
  }
  function viewOrders(){
    var counts = { all: S.orders.length };
    Object.keys(STATUS).forEach(function(k){ counts[k] = S.orders.filter(function(o){ return o.status === k; }).length; });
    var chips = '<div class="chips"><button class="chip ' + (S.filter === 'all' ? 'on' : '') + '" data-filter="all">Hammasi ' + counts.all + '</button>' +
      Object.keys(STATUS).map(function(k){ return '<button class="chip ' + (S.filter === k ? 'on' : '') + '" data-filter="' + k + '">' + STATUS[k][0] + ' ' + counts[k] + '</button>'; }).join('') + '</div>';
    var list = S.orders.filter(function(o){ return S.filter === 'all' || o.status === S.filter; });
    if (!list.length) return chips + '<div class="empty"><b>📭</b>Buyurtma yo\'q.</div>';
    var total = list.length; list = list.slice(0, S.shown);
    return chips + list.map(function(o){
      var st = STATUS[o.status] || [o.status, '#9a978c'];
      var d = phoneDigits(o.phone);
      var its = o.items || [], open = !!S.oopen[o.id], first = its[0] ? splitOpt(its[0].name) : { name: '', opts: [] };
      var sum = '<div class="ohead" data-otog="' + o.id + '">' + (its[0] ? othumb(its[0]) : '') +
        '<div class="tx"><b>' + esc(first.name) + (its.length > 1 ? ' <span class="muted">+' + (its.length - 1) + ' ta</span>' : '') + '</b>' +
        '<span class="muted">' + esc(o.customer_name) + ' · ' + esc(its.map(function(i){ return i.qty + ' dona'; }).join(', ')) + '</span><br>' +
        '<b style="color:var(--gold2);display:inline">' + money((+o.total || 0) + (+o.shipping || 0)) + '</b> <span class="muted">' + (o.paid ? '· ✅ to\'langan' : o.receipt_thumb ? '· 🧾 chek bor' : '') + (o.track ? ' · 📮' : '') + '</span></div>' +
        '<span class="ch' + (open ? ' up' : '') + '">›</span></div>';
      if (!open) return '<div class="card"><div class="row sp"><b>#' + o.id + '</b><span class="muted">' + fmtDate(o.created_at) + '</span><span class="pill" style="color:' + st[1] + '">' + esc(st[0]) + '</span></div>' + sum + '</div>';
      return '<div class="card"><div class="row sp"><b>#' + o.id + '</b><span class="muted">' + fmtDate(o.created_at) + '</span><span class="pill" style="color:' + st[1] + '">' + esc(st[0]) + '</span></div>' + sum +
        '<div class="ord">' + kv('Ism Familiya', o.customer_name) + (o.customer_id ? '<div class="kv"><span>Mijoz ID:</span> <b>' + (1000 + o.customer_id) + '</b> <button class="btn small ghost" style="padding:1px 8px;font-size:12px" data-gocust="' + o.customer_id + '">kartani ochish</button></div>' : '') + kv('Telefon', o.phone) + kv('Manzil', o.address) + (o.note ? kv('Izoh', o.note) : '') + '</div>' +
        (o.items || []).map(function(i){
          var sp = splitOpt(i.name);
          return '<div class="ord item"><div class="row" style="align-items:flex-start;gap:10px">' + othumb(i) + '<div style="flex:1;min-width:0">' + kv('Mahsulot', sp.name) + sp.opts.map(function(x){ var k = x.indexOf(':'); return kv(x.slice(0, k), x.slice(k + 1).trim()); }).join('') +
            kv('Soni', i.qty + ' dona' + (i.group ? ' (guruh)' : '')) + kv('Narxi', money(i.unit * i.qty)) + '</div></div></div>';
        }).join('') +
        (o.receipt_thumb ? '<div class="ord item"><div class="muted" style="margin-bottom:6px">To\'lov cheki (kattalashtirish uchun bosing):</div><img class="rcp" loading="lazy" decoding="async" data-rcp="' + o.id + '" src="' + esc(o.receipt_thumb) + '" alt="chek"></div>' : (S.pay && S.pay.card ? '<div class="ord item"><span class="muted">To\'lov cheki: </span><b style="color:#ff4d4f">yuklanmagan</b></div>' : '')) +
        '<label style="margin:8px 0;font-size:14px;color:var(--text)"><input type="checkbox" data-paid="' + o.id + '"' + (o.paid ? ' checked' : '') + '> ✅ To\'lov qabul qilindi</label>' +
        '<div class="row sp"><span class="muted">Tovarlar</span><b>' + money((+o.total || 0) + (+o.discount || 0)) + '</b></div>' +
        (+o.discount > 0 ? '<div class="row sp"><span class="muted">🎟 Kupon ' + esc(o.coupon) + '</span><b style="color:#6fcf97">−' + money(o.discount) + '</b></div>' : '') +
        '<label>📮 Trek raqami (mijoz ko\'radi)</label><input data-track="' + o.id + '" value="' + esc(o.track || '') + '" placeholder="Masalan: YT1234567890123" autocapitalize="characters">' +
        '<label>Yuk (kargo) narxi, so\'m — mijoz ko\'radi</label><input type="number" inputmode="numeric" data-ship="' + o.id + '" value="' + esc(+o.shipping || '') + '" placeholder="Masalan: 25000">' +
        '<div class="row sp" style="margin-bottom:10px"><span class="muted">To\'lov jami</span><b style="color:var(--gold2)">' + money((+o.total || 0) + (+o.shipping || 0)) + '</b></div>' +
        '<label>Holat</label><select data-status="' + o.id + '">' + Object.keys(STATUS).map(function(k){ return '<option value="' + k + '"' + (k === o.status ? ' selected' : '') + '>' + STATUS[k][0] + '</option>'; }).join('') + '</select>' +
        '<label>Izoh (faqat sizga ko\'rinadi)</label><input data-anote="' + o.id + '" value="' + esc(o.admin_note) + '" placeholder="Masalan: yuan kursi 1750">' +
        '<div class="row" style="flex-wrap:wrap"><a class="btn small ghost" href="tel:+' + d + '">📞 Qo\'ng\'iroq</a><a class="btn small ghost" target="_blank" rel="noopener" href="https://t.me/+' + d + '">✈️ Telegram</a>' +
        '<button class="btn small danger" data-delorder="' + o.id + '" style="margin-left:auto">O\'chirish</button></div></div>';
    }).join('') + (total > list.length ? '<button class="btn ghost" data-more="o" style="margin-bottom:12px">Yana ko\'rsatish (' + (total - list.length) + ')</button>' : '');
  }
  async function setStatus(id, status){
    var o = S.orders.filter(function(x){ return x.id === id; })[0]; if (!o) return;
    var prev = o.status; if (prev === status) return;
    var r = await sb.from('orders').update({ status: status }).eq('id', id);

  function compress(file, maxSide, quality){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file); var img = new Image();
      img.onload = function(){
        var w = img.naturalWidth, h = img.naturalHeight, k = Math.min(1, maxSide / Math.max(w, h));
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        c.toBlob(function(b){ b ? resolve(b) : reject(new Error('Rasmni qayta ishlab bo\'lmadi')); }, 'image/jpeg', quality);
      };
      img.onerror = function(){ reject(new Error('Rasm ochilmadi')); }; img.src = url;
    });
  }

      if (o.customer_id && m['c' + o.customer_id]) c = m['c' + o.customer_id];
      else if (byPhone[k9]) c = byPhone[k9];
      else { c = m['p' + k9]; if (!c) { c = m['p' + k9] = { key: 'p' + k9, name: o.customer_name, phone: o.phone, address: o.address, orders: [], sum: 0, paid: 0, last: o.created_at }; out.push(c); } }
      c.orders.push(o);
      if (o.status !== 'cancelled') { var t = (+o.total || 0) + (+o.shipping || 0); c.sum += t; if (o.paid) c.paid += t; }
      if (o.created_at > c.last) c.last = o.created_at;
      if (!c.acc && o.created_at >= c.last) { c.name = o.customer_name; c.address = o.address; c.phone = o.phone; }
    });
    return out.sort(function(a, b){ return a.last < b.last ? 1 : -1; });
  }
  async function loadAccounts(){
    try { var r = await sb.rpc('admin_customers'); if (!r.error && r.data) S.accts = r.data; } catch(e){}
  }
  async function resetPin(id){
    var pin = prompt('Mijozga yangi PIN bering (4–6 ta raqam):'); if (pin === null) return;
    if (!/^\d{4,6}$/.test(pin.trim())) { toast('PIN 4–6 ta raqam bo\'lsin'); return; }
    var r = await sb.rpc('admin_reset_pin', { p_id: id, p_pin: pin.trim() });
    if (r.error) toast('Xatolik: ' + errMsg(r.error)); else toast('PIN o\'zgartirildi. Mijozga ayting: ' + pin.trim());
  }
  async function toggleBlock(id, block){
    if (!confirm(block ? 'Mijoz bloklansinmi? U buyurtma bera olmaydi.' : 'Blokdan chiqarilsinmi?')) return;
    var r = await sb.rpc('admin_block', { p_id: id, p_blocked: block });
    if (r.error) { toast('Xatolik: ' + errMsg(r.error)); return; }
    await loadAccounts(); toast(block ? 'Bloklandi' : 'Blokdan chiqarildi'); $('clist').innerHTML = custListHtml();
  }
  function custListHtml(){
    var q = S.cq.trim().toLowerCase(), qd = q.replace(/\D/g, '');
    var list = customers().filter(function(c){
      if (!q) return true;
      return c.name.toLowerCase().indexOf(q) >= 0 || (qd && (c.phone.replace(/\D/g, '').indexOf(qd) >= 0 || (c.acc && String(1000 + c.acc.id) === qd)));
    });
    if (!list.length) return '<div class="empty"><b>👥</b>Mijoz topilmadi.</div>';
    var ctotal = list.length; list = list.slice(0, S.cshown);
    return list.map(function(c){
      var d = phoneDigits(c.phone), open = S.copen === c.key, a = c.acc;
      return '<div class="card"><div class="row sp" data-cust="' + esc(c.key) + '" style="cursor:pointer"><div style="min-width:0"><div style="font-weight:700">' + esc(c.name) + '</div>' +
        '<div class="muted">' + (a ? '<b style="color:var(--gold2)">ID ' + (1000 + a.id) + '</b> · ' : '') + '📞 ' + esc(c.phone) + (a ? (a.blocked ? ' · <span style="color:#ff4d4f">🚫 bloklangan</span>' : ' · <span style="color:#6fcf97">✅ hisob</span>') : '') + '</div></div>' +
        '<div style="text-align:right"><b style="color:var(--gold2)">' + money(c.sum) + '</b><div class="muted">' + c.orders.length + ' ta buyurtma</div></div></div>' +
        (open ? '<div class="ord item">' + (a ? kv('Mijoz ID', 1000 + a.id) : kv('Hisob', 'ochmagan (eski buyurtma)')) + kv('Ism Familiya', c.name) + kv('Telefon', c.phone) + kv('Manzil', c.address || '—') +
          (a ? kv('Ro\'yxatdan o\'tgan', fmtDate(a.created_at)) + kv('Oxirgi kirish', a.last_login ? fmtDate(a.last_login) : '—') + kv('Holat', a.blocked ? 'Bloklangan' : 'Faol') : '') +
          kv('Buyurtmalar soni', c.orders.length) + kv('Jami xarid (yuk bilan)', money(c.sum)) + kv('To\'langan', money(c.paid)) + '</div>' +
          '<div class="muted" style="margin:10px 0 2px">Buyurtmalar tarixi:</div>' +
          c.orders.map(function(o){ var st = STATUS[o.status] || [o.status, '#9a978c'];
            return '<div class="kv" style="margin-top:6px;border-top:1px dashed var(--line);padding-top:6px"><b>#' + o.id + '</b> · ' + fmtDate(o.created_at) + ' · <span style="color:' + st[1] + '">' + esc(st[0]) + '</span> · ' + money(o.total) + (o.paid ? ' · <span style="color:#6fcf97">to\'langan</span>' : '') + '<br><span class="muted">' +
              (o.items || []).map(function(i){ return esc(i.name) + ' × ' + esc(i.qty); }).join(', ') + '</span></div>'; }).join('') +
          '<div class="row" style="margin-top:10px;flex-wrap:wrap"><a class="btn small ghost" href="tel:+' + d + '">📞 Qo\'ng\'iroq</a><a class="btn small ghost" target="_blank" rel="noopener" href="https://t.me/+' + d + '">✈️ Telegram</a>' +
          (a ? '<button class="btn small ghost" data-custedit="' + a.id + '">✏️ Tahrirlash</button><button class="btn small ghost" data-resetpin="' + a.id + '">🔑 PIN tiklash</button><button class="btn small danger" data-block="' + a.id + '" data-to="' + (a.blocked ? '0' : '1') + '">' + (a.blocked ? 'Blokdan chiqarish' : '🚫 Bloklash') + '</button>' : '') + '</div>' : '') +
        '</div>';
    }).join('') + (ctotal > list.length ? '<button class="btn ghost" data-more="c" style="margin-bottom:12px">Yana ko\'rsatish (' + (ctotal - list.length) + ')</button>' : '');
  }
  function openCustEdit(id){
    var a = S.accts.filter(function(x){ return x.id === id; })[0]; if (!a) return;
    $('modal').innerHTML = '<div class="in"><div class="row sp" style="margin-bottom:10px"><h2 style="margin:0">Mijoz ID ' + (1000 + a.id) + '</h2><button class="btn small ghost" data-closemodal="1">✕</button></div>' +
      '<label>Ism Familiya</label><input id="ce_name" value="' + esc(a.name) + '">' +
      '<label>Telefon raqam (hisob kaliti)</label><input id="ce_phone" type="tel" value="+' + esc(a.phone) + '">' +
      '<label>Manzil</label><input id="ce_addr" value="' + esc(a.address) + '">' +
      '<div class="muted" style="margin-bottom:12px">Raqam o\'zgarsa, mijoz yangi raqam bilan kiradi (PIN o\'sha-o\'zi qoladi).</div>' +
      '<button class="btn" id="ce_save" data-id="' + a.id + '">Saqlash</button></div>';
    $('modal').classList.add('show'); $('modal').scrollTop = 0;
  }
  async function saveCustEdit(id){
    var r = await sb.rpc('admin_update_customer', { p_id: id, p_name: $('ce_name').value.trim(), p_address: $('ce_addr').value.trim(), p_phone: $('ce_phone').value.trim() });
    if (r.error) { toast(errMsg(r.error)); return; }
    await loadAccounts(); closeModal(); toast('Saqlandi'); if (S.tab === 'customers') render();
  }
  function viewCustomers(){
    var all = customers();
    var repeat = all.filter(function(c){ return c.orders.length > 1; }).length;
    return '<input id="cu_q" type="search" placeholder="🔍 Ism, telefon yoki ID bo\'yicha qidirish" value="' + esc(S.cq) + '" autocomplete="off">' +
      '<div class="muted" style="margin:-4px 0 10px">Jami mijoz: <b>' + all.length + '</b> · Qayta buyurtma bergan: <b>' + repeat + '</b></div><div id="clist">' + custListHtml() + '</div>';
  }

  function viewStats(){
    var live = S.orders.filter(function(o){ return o.status !== 'cancelled'; });
    var sum = live.reduce(function(s, o){ return s + (+o.total || 0); }, 0);
    var today = new Date().toDateString();
    var tOrders = S.orders.filter(function(o){ return new Date(o.created_at).toDateString() === today; }).length;
    var avg = live.length ? sum / live.length : 0;
    var maxS = Math.max(1, Math.max.apply(null, Object.keys(STATUS).map(function(k){ return S.orders.filter(function(o){ return o.status === k; }).length; })));
    var byProd = {};
    live.forEach(function(o){ (o.items || []).forEach(function(i){ byProd[i.name] = (byProd[i.name] || 0) + (+i.qty || 0); }); });
    var top = Object.keys(byProd).map(function(k){ return [k, byProd[k]]; }).sort(function(a, b){ return b[1] - a[1]; }).slice(0, 5);
    var topMax = top.length ? top[0][1] : 1;
    var days = [];
    for (var d = 6; d >= 0; d--) {
      var dt = new Date(); dt.setDate(dt.getDate() - d); var key = dt.toDateString();
      days.push({ label: dt.getDate() + '/' + (dt.getMonth() + 1), n: S.orders.filter(function(o){ return new Date(o.created_at).toDateString() === key; }).length });
    }
    var dMax = Math.max(1, Math.max.apply(null, days.map(function(x){ return x.n; })));
    return '<div class="grid2"><div class="stat"><div class="muted">Jami buyurtma</div><div class="big">' + S.orders.length + '</div></div>' +
      '<div class="stat"><div class="muted">Bugun</div><div class="big">' + tOrders + '</div></div>' +
      '<div class="stat"><div class="muted">Umumiy summa</div><div class="big" style="font-size:16px">' + money(sum) + '</div></div>' +
      '<div class="stat"><div class="muted">O\'rtacha chek</div><div class="big" style="font-size:16px">' + money(avg) + '</div></div></div>' +
      '<h2>Oxirgi 7 kun</h2><div class="card"><div class="days">' + days.map(function(x){ return '<div><i style="height:' + Math.round(x.n / dMax * 70) + 'px"></i>' + x.n + '<br>' + x.label + '</div>'; }).join('') + '</div></div>' +
      '<h2>Holatlar bo\'yicha</h2><div class="card">' + Object.keys(STATUS).map(function(k){
        var n = S.orders.filter(function(o){ return o.status === k; }).length;
        return '<div style="margin-bottom:8px"><div class="row sp"><span style="font-size:13px">' + STATUS[k][0] + '</span><b>' + n + '</b></div><div class="bar"><i style="width:' + Math.round(n / maxS * 100) + '%;background:' + STATUS[k][1] + '"></i></div></div>';
      }).join('') + '</div>' +
      '<h2>Eng ko\'p sotilgan</h2><div class="card">' + (top.length ? top.map(function(t){
        return '<div style="margin-bottom:8px"><div class="row sp"><span style="font-size:13px">' + esc(t[0]) + '</span><b>' + t[1] + ' ta</b></div><div class="bar"><i style="width:' + Math.round(t[1] / topMax * 100) + '%"></i></div></div>';
      }).join('') : '<div class="muted">Hali ma\'lumot yo\'q</div>') + '</div>';
  }

  /* ---------- Hodisalar ---------- */
  document.addEventListener('click', async function(e){
    var t = e.target.closest('[data-oimg],[data-otog],[data-chopen],[data-chback],[data-chattach],[data-chmedel],#ch_send,[data-nfattach],[data-nfmedel],#nf_send,[data-nfdel],[data-rvsave],[data-rvhide],[data-rvdel],[data-sub],[id^=sv_],[data-cpdel],#cf_add,[data-adcopy],[data-adadd],[data-addel],[data-admv],#ad_save,[data-tab],[data-cust],[data-more],[data-gocust],[data-custedit],#ce_save,[data-rcp],[data-resetpin],[data-block],[data-filter],[data-edit],[data-closemodal],[data-pickimg],[data-pickgal],[data-rmgal],[data-rmimg],[data-delprod],[data-delorder],#l_go,#pf_save,[data-pickgal],[data-rmgal],#cc_use,#cc_save,#tx_save,#logout,#refresh');
    if (!t) return;
    if (t.id === 'l_go') return doLogin();
    if (t.id === 'logout') return logout();
    if (t.id === 'refresh') { await refreshAll(); render(); toast('Yangilandi'); return; }
    if (t.dataset.rcp) return showReceipt(+t.dataset.rcp);
    if (t.dataset.gocust) { S.tab = 'customers'; S.cq = String(1000 + +t.dataset.gocust); S.copen = 'c' + t.dataset.gocust; await loadAccounts(); render(); window.scrollTo(0, 0); return; }
    if (t.dataset.custedit) return openCustEdit(+t.dataset.custedit);
    if (t.id === 'ce_save') return saveCustEdit(+t.dataset.id);
    if (t.dataset.resetpin) return resetPin(+t.dataset.resetpin);
    if (t.dataset.block) return toggleBlock(+t.dataset.block, t.dataset.to === '1');
    if (t.dataset.cust !== undefined) { S.copen = S.copen === t.dataset.cust ? '' : t.dataset.cust; $('clist').innerHTML = custListHtml(); return; }
    if (t.dataset.tab) { S.tab = t.dataset.tab; if (S.tab === 'texts') S.sub = ''; S.shown = 30; S.cshown = 30; render(); window.scrollTo(0, 0); refreshTab(S.tab); return; }
    if (t.dataset.more) { if (t.dataset.more === 'o') S.shown += 30; else { S.cshown += 30; } render(); return; }
    if (t.dataset.filter) { S.filter = t.dataset.filter; S.shown = 30; render(); return; }
    if (t.dataset.edit) return openEdit(t.dataset.edit);
    if (t.dataset.closemodal) return closeModal();
    if (t.dataset.pickimg) return $('pf_file').click();
    if (t.dataset.pickgal) return $('pf_file2').click();
    if (t.dataset.rmgal !== undefined) { S.editing.images.splice(+t.dataset.rmgal, 1); $('pf_gal').innerHTML = galBlock(S.editing); return; }
    if (t.dataset.rmimg) { S.editing.image_url = ''; $('pf_pic').innerHTML = picBlock(S.editing); return; }
    if (t.dataset.delprod) return delProduct(+t.dataset.delprod);
    if (t.dataset.delorder) return delOrder(+t.dataset.delorder);
    if (t.id === 'pf_save') return saveProduct();
    if (t.id === 'cc_use') { var c = calcVals(); if (c.sell > 0) { $('pf_price').value = c.sell; toast('Narx qo\'yildi'); } else toast('Avval ¥ narxini kiriting'); return; }
    if (t.id === 'cc_save') return calcSave();
    if (t.dataset.oimg) return showBig(t.dataset.oimg);
    if (t.dataset.otog) { var oid = +t.dataset.otog; S.oopen[oid] = !S.oopen[oid]; var y0 = window.scrollY; render(); window.scrollTo(0, y0); return; }
    if (t.dataset.chopen) return chatOpen(+t.dataset.chopen);
    if (t.dataset.chback) { S.chatOpen = null; chatRender(); loadChatThreads().then(function(){ chatRender(); renderNav(); }); return; }
    if (t.dataset.chattach) { $('ch_file').click(); return; }
    if (t.dataset.chmedel) { S.chMedia = null; chatRender(true); return; }
    if (t.id === 'ch_send') return chatSend();
    if (t.dataset.nfattach) { $('nf_file').click(); return; }
    if (t.dataset.nfmedel) { S.nfMedia = null; notifyRender(); return; }
    if (t.id === 'nf_send') return nfSend();
    if (t.dataset.nfdel) { if (!confirm('Xabar o\'chirilsinmi? Mijozlardan ham yo\'qoladi.')) return; var dr = await sb.from('announcements').delete().eq('id', +t.dataset.nfdel); if (dr.error) { toast('Xatolik: ' + errMsg(dr.error)); return; } await loadAnns(); notifyRender(); return; }
    if (t.dataset.rvsave || t.dataset.rvhide || t.dataset.rvdel) return rvAction(t);
    if (t.dataset.sub !== undefined) { S.sub = t.dataset.sub; S.chatOpen = null; if (S.sub === 'chat') { loadChatThreads().then(function(){ chatRender(); renderNav(); }); } if (S.sub === 'notify') loadAnns().then(notifyRender); if (S.sub === 'reviews') loadRevs().then(rvRender); render(); window.scrollTo(0, 0); return; }
    if (/^sv_/.test(t.id)) return saveSub(t.id.slice(3));
    if (t.id === 'cf_add') return cpAdd();
    if (t.dataset.cpdel) return cpDel(+t.dataset.cpdel);
    if (t.dataset.adcopy) { try { await navigator.clipboard.writeText(AD_SPEC); toast('Nusxa olindi. Reklamachiga yuboring'); } catch(e){ toast('Nusxa olinmadi, matnni belgilab oling'); } return; }
    if (t.dataset.adadd || t.dataset.addel || t.dataset.admv || t.id === 'ad_save') return adAction(t);
  });
  document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && e.target && (e.target.id === 'l_pass' || e.target.id === 'l_email')) doLogin(); });
  document.addEventListener('input', function(e){ if (e.target && e.target.id === 'cu_q') { S.cq = e.target.value; $('clist').innerHTML = custListHtml(); return; }  if (e.target && /^cc_/.test(e.target.id)) calcUpdate(); });
  document.addEventListener('change', async function(e){
    var t = e.target;
    if (t.id === 'ad_file') {
      var f = t.files && t.files[0]; if (!f || !S._adslot) { t.value = ''; return; }
      // faylni darrov xotiraga nusxalaymiz (Android'da fayl havolasi tezda eskirib qoladi)
      S._adst = { msg: 'Fayl o\'qilmoqda: ' + (f.name || '') + ' (' + (f.size / 1048576).toFixed(1) + ' MB)...' }; adsRender();
      var snap = null;
      try { var buf = await f.arrayBuffer(); snap = new File([buf], f.name || 'fayl', { type: f.type || '' }); }
      catch(err){ t.value = ''; S._adst = { err: true, msg: 'Telefon faylni o\'qishga ruxsat bermadi. Faylni avval Galereya yoki «Yuklanmalar» (Downloads) papkasiga saqlab, shu yerdan tanlang (Telegram yoki «Oxirgi» ro\'yxatidan emas). Keyin qayta urinib ko\'ring.' }; adsRender(); return; }
      t.value = ''; adUpload(snap, S._adslot); return;
    }
    if (t.dataset && t.dataset.cptog) return cpToggle(+t.dataset.cptog, t.checked);
    if (t.dataset && t.dataset.adtog) { var q = t.dataset.adtog.split(':'); S.ads[q[0]][+q[1]].on = t.checked; return; }
    if (t.dataset && t.dataset.adlink) { var q2 = t.dataset.adlink.split(':'), nl = normLink(t.value); if (nl === null) { toast('Havola noto\'g\'ri. Masalan: t.me/kanal yoki https://sayt.uz'); S.ads[q2[0]][+q2[1]].link = t.value.trim(); return; } t.value = nl; S.ads[q2[0]][+q2[1]].link = nl; return; }
    if (t.dataset && t.dataset.status) return setStatus(+t.dataset.status, t.value);
    if (t.dataset && t.dataset.paid) return setPaid(+t.dataset.paid, t.checked);
    if (t.id === 'ch_file' && t.files && t.files[0]) { var cf = t.files[0]; chatFile(cf); t.value = ''; return; }
    if (t.id === 'nf_file' && t.files && t.files[0]) { var nf = t.files[0]; nfFile(nf); t.value = ''; return; }
    if (t.dataset && t.dataset.nftog) { var tg = await sb.from('announcements').update({ active: t.checked }).eq('id', +t.dataset.nftog); if (tg.error) toast('Xatolik: ' + errMsg(tg.error)); else toast(t.checked ? 'Ko\'rinadi' : 'Yashirildi'); return; }
    if (t.dataset && t.dataset.track) return saveTrack(+t.dataset.track, t.value);
    if (t.dataset && t.dataset.ship) return saveShipping(+t.dataset.ship, t.value);
    if (t.dataset && t.dataset.anote) return saveAdminNote(+t.dataset.anote, t.value.trim());
    if (t.id === 'pf_file' && t.files && t.files[0]) { uploadImage(t.files[0]); t.value = ''; }
    if (t.id === 'pf_file2' && t.files && t.files.length) { uploadGallery(Array.prototype.slice.call(t.files)); t.value = ''; }
  });
  setInterval(async function(){
    if (document.hidden || !$('view')) return;
    try {
      var before = S.chUnread || 0, r = await sb.rpc('admin_chat_unread');
      if (!r.error && r.data != null) { S.chUnread = +r.data || 0; renderNav(); }
      if (S.tab === 'texts' && S.sub === 'chat' && $('chbox')) {
        var act = document.activeElement, typing = act && act.id === 'ch_text' && act.value;
        if (S.chatOpen) { var n0 = (S.chatMsgs || []).length, l0 = n0 ? S.chatMsgs[n0 - 1].id : 0; await loadChatMsgs(); var n1 = (S.chatMsgs || []).length; if (n1 && S.chatMsgs[n1 - 1].id !== l0) chatRender(true); }
        else if (!typing) { await loadChatThreads(); chatRender(); }
      } else if (S.chUnread > before && S.tab === 'texts' && !S.sub) { loadChatThreads().then(function(){ render(); }); }
    } catch(e){}
  }, 6000);
  setInterval(async function(){
    if (document.hidden || !$('view') || S.tab !== 'orders' || $('modal').classList.contains('show')) return;
    var active = document.activeElement; if (active && /INPUT|TEXTAREA|SELECT/.test(active.tagName)) return;
    refreshTab('orders');
  }, 60000);

  async function boot(){
    if (!sb) { $('app').innerHTML = '<div class="empty"><b>⚠️</b>Ulanish sozlanmagan (config.js).</div>'; return; }
    try {
      var r = await sb.auth.getSession();
      if (r.data && r.data.session) await enter(); else showLogin('');
    } catch(e){ showLogin(''); }
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  boot();
})();
</script>
