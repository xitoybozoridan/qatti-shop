<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" id="themeMeta" content="#0e0e10">
<script>try{if(localStorage.getItem("qs_theme")==="light"){document.documentElement.setAttribute("data-theme","light");}}catch(e){}</script>
<title>qSHOP</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0e0e10; --card:#17171b; --card2:#1e1e24; --line:#2a2a31;
  --gold:#d4af37; --gold2:#f3d77a; --text:#f3f1ea; --muted:#9a978c;
  --red:#ff4d4f; --green:#3ecf8e;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;display:flex;justify-content:center}
#app{width:100%;max-width:480px;min-height:100vh;padding-bottom:84px;position:relative}
header{position:sticky;top:0;z-index:20;background:rgba(14,14,16,.92);
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--bg);border:2px solid var(--gold);color:var(--gold2);
  display:grid;place-items:center;font-weight:800;font-size:12.5px;letter-spacing:-.5px;flex:none}
header h1{font-size:18px;margin:0;letter-spacing:.3px}
header h1 span{color:var(--gold)}
header small{display:block;color:var(--muted);font-size:11px;margin-top:1px}
main{padding:14px 16px}
.hero{background:linear-gradient(135deg,#2a2208,#16130a 60%);border:1px solid #3b3110;border-radius:18px;padding:16px;margin-bottom:16px}
.hero b{color:var(--gold2);font-size:17px;display:block;margin-bottom:4px}
.hero p{margin:0;color:#cfc9b3;font-size:13px;line-height:1.45}
h2{font-size:15px;margin:18px 0 10px;color:var(--gold2);letter-spacing:.3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.card:active{transform:scale(.98)}
.pic{aspect-ratio:1/1;background:var(--card2);display:grid;place-items:center;font-size:56px;position:relative;overflow:hidden}
.pic img{width:100%;height:100%;object-fit:cover}
.adtop{position:relative;margin:0 0 16px;overflow:hidden;border-radius:18px;touch-action:pan-y}
.adtrack{display:flex;gap:8px;transition:transform .45s ease;will-change:transform}
.adtrack.nt{transition:none}
.adtop .sl{flex:0 0 88%;aspect-ratio:12/5;position:relative;border-radius:16px;overflow:hidden;background:var(--card2);border:1px solid var(--line);display:block}
.adtop.one .sl{flex-basis:100%}
.adtop img,.adtop video,.adinfo img,.adinfo video{width:100%;height:100%;object-fit:cover;display:block}
.adfeed img,.adfeed video{width:100%;height:100%;object-fit:cover;display:block}
.bell{margin-left:auto;position:relative;background:var(--card);border:1px solid var(--line);color:var(--text);min-width:50px;height:42px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font-family:inherit;padding:0 6px;flex:none}
.bell span{font-size:17px;line-height:1}
.bell small{font-size:9px;color:var(--muted);margin:0}
.bell .bn{position:absolute;top:-6px;right:-5px;background:var(--red);color:#fff;font-size:10px;font-weight:700;min-width:17px;height:17px;border-radius:9px;display:none;place-items:center;padding:0 4px;font-style:normal}
header>div:nth-child(2){min-width:0;flex:1}
header small#tagline{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--muted);padding:10px;border-radius:10px;font-weight:700;font-family:inherit;font-size:14px}
.seg button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405}
.chat{display:flex;flex-direction:column;height:calc(100vh - 236px);height:calc(100dvh - 236px);min-height:300px}
.chatlist{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px 8px;-webkit-overflow-scrolling:touch}
.cb{max-width:82%;border-radius:16px;padding:8px 11px;font-size:14px;line-height:1.4;word-break:break-word}
.cb.me{align-self:flex-end;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border-bottom-right-radius:5px}
.cb.ad{align-self:flex-start;background:var(--card2);border:1px solid var(--line);border-bottom-left-radius:5px}
.cb .cw{font-size:11px;color:var(--gold2);font-weight:700;margin-bottom:2px}
.cb .cd{font-size:10px;opacity:.6;text-align:right;margin-top:3px}
.cb .ct{white-space:pre-wrap}
.cb a{color:inherit;text-decoration:underline}
.cb .cm{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:5px;background:#000}
.cday{align-self:center;font-size:11px;color:var(--muted);background:var(--card);border-radius:10px;padding:2px 10px}
.chbar{display:flex;gap:8px;align-items:flex-end;padding-top:8px}
.chbar textarea{flex:1;margin:0;min-height:44px;max-height:110px;resize:none;border-radius:14px}
.chbar .btn{width:auto;padding:0;width:46px;height:44px;flex:none;display:grid;place-items:center;font-size:18px}
.chprev{display:flex;align-items:center;gap:8px;padding:6px 0}
.chprev img{height:54px;border-radius:8px}
.soc{display:flex;gap:10px;font-size:11.5px;color:var(--muted);margin:-1px 0 1px}
.soc i{font-style:normal;opacity:.7}
.likebtn{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:20px;padding:7px 12px;font-size:14px;font-family:inherit;display:flex;gap:6px;align-items:center}
.likebtn.on{border-color:#7a2f35;background:#2a1519}
.rvbox h2{margin:18px 0 8px}
.stars{display:flex;gap:4px;margin:6px 0}
.stars button{background:none;border:0;font-size:28px;color:#4a4a52;padding:0 2px;line-height:1}
.stars button.on{color:var(--gold2)}
.rv{border-top:1px solid var(--line);padding:10px 0;font-size:13.5px;line-height:1.45}
.rv .rh{display:flex;justify-content:space-between;gap:8px;align-items:center}
.rv .ry{color:var(--gold2);letter-spacing:1px}
.rv .rb{color:#6fcf97;font-size:11px;margin-left:6px}
.rv .rr{background:var(--card2);border-left:3px solid var(--gold);border-radius:8px;padding:6px 9px;margin-top:6px;font-size:12.5px}
.annc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
.annc.new{border-color:var(--gold)}
.annc .at{font-weight:800;color:var(--gold2);font-size:15px;margin-bottom:6px}
.annc .am{display:block;width:100%;max-height:300px;object-fit:contain;border-radius:10px;background:#000;margin-bottom:8px}
.annc .ab{white-space:pre-wrap;font-size:14px;line-height:1.45;word-break:break-word}
.annc a.btn{margin-top:10px}
.annc .ab a,.rv a{color:var(--gold2)}
.adtag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:2px 7px;border-radius:7px;letter-spacing:.3px;z-index:2;pointer-events:none}
.addots{position:absolute;bottom:7px;left:0;right:0;display:flex;justify-content:center;gap:5px;z-index:2;pointer-events:none}
.addots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.45)}
.addots i.on{background:var(--gold2);width:16px;border-radius:4px}
.adfeed{text-decoration:none;color:inherit}
.adfeed .pic{font-size:0}
.adfeed .info{justify-content:center}
.adfeed .cta{color:var(--gold2);font-weight:700;font-size:13px}
.adinfo{margin-top:16px;border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);position:relative}
.adinfo .m{position:relative;background:#000;display:block}
.adinfo .m img,.adinfo .m video{height:auto;max-height:70vh;object-fit:contain}
.adinfo .cta{display:block;text-align:center;padding:11px;font-weight:700;font-size:14px;color:var(--gold2);text-decoration:none}
.badge{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;font-size:11px;font-weight:700;padding:3px 7px;border-radius:8px}
.info{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.name{font-size:13px;line-height:1.3;min-height:34px}
.price{font-size:16px;font-weight:800;color:var(--gold2)}
.old{font-size:11px;color:var(--muted);text-decoration:line-through;margin-left:6px;font-weight:400}
.card .old{display:block;margin:2px 0 0}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2))}
.meta{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 14px;font-weight:700;font-size:14px;cursor:pointer;color:#1a1405;
  background:linear-gradient(135deg,var(--gold2),var(--gold));width:100%;display:block;text-align:center;text-decoration:none;font-family:inherit}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(14,14,16,.96);
  border-top:1px solid var(--line);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);z-index:30}
nav button{flex:1;background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;position:relative;font-family:inherit}
nav button span{font-size:20px}
nav button.on{color:var(--gold2)}
nav .dot{position:absolute;top:0;right:26%;background:var(--red);color:#fff;font-size:10px;min-width:16px;height:16px;border-radius:8px;display:grid;place-items:center;padding:0 4px;font-style:normal}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card);border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:8px 14px;font-size:13px;font-family:inherit}
.chip.on{background:#2a2208;border-color:var(--gold);color:var(--gold2)}
input[type=search]{-webkit-appearance:none;appearance:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
.sheet-bg.show{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:480px;max-height:92vh;overflow:auto;
  background:var(--card);border-radius:22px 22px 0 0;border-top:1px solid var(--line);z-index:50;padding:0 0 20px;display:none}
.sheet.show{display:block}
.sheet .pic{aspect-ratio:1/1;font-size:90px;border-radius:0}
.sheet .pic img{object-fit:contain}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;aspect-ratio:1/1;background:var(--card2)}
.gal::-webkit-scrollbar{display:none}
.slide{flex:none;width:100%;height:100%;scroll-snap-align:center}
.slide img{width:100%;height:100%;object-fit:contain}
.lb{position:fixed;inset:0;background:#000;z-index:80;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;touch-action:pan-x pinch-zoom}
.lb::-webkit-scrollbar{display:none}
.lb .s{flex:none;width:100%;height:100%;scroll-snap-align:center;display:grid;place-items:center}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.paybox{padding:14px;margin:10px 0 14px}
.cardno{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border:1px dashed var(--gold);border-radius:12px;padding:12px;margin:10px 0}
.cardno b{font-size:15px;letter-spacing:.3px;white-space:nowrap;color:var(--gold2)}
.rc{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--line);cursor:pointer;background:var(--card2)}
.lbd{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:90;background:var(--gold);color:#1a1405;border:0;border-radius:24px;padding:12px 22px;font-size:15px;font-weight:700;font-family:inherit}
.lbx{position:fixed;top:14px;right:14px;z-index:90;width:44px;height:44px;border-radius:50%;background:rgba(40,40,40,.85);color:#fff;border:0;font-size:20px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:8px}
.dots i{width:7px;height:7px;border-radius:50%;background:#444}
.dots i.on{background:var(--gold)}
.opt{margin-bottom:10px}.optn{font-size:13px;color:var(--muted);margin-bottom:6px}
.sheet .body{padding:14px 16px}
.close{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:17px;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;z-index:2}
.row{display:flex;gap:10px;margin-top:12px}
.row .btn{flex:1}
.hint{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}
.cartrow{display:flex;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:10px;align-items:center}
.cartrow .th{width:54px;height:54px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:28px;flex:none;overflow:hidden}
.cartrow .th img{width:100%;height:100%;object-fit:cover}
.cartrow .c{flex:1;min-width:0}
.cartrow .c div:first-child{font-size:13px;line-height:1.3}
.tag{display:inline-block;font-size:10px;padding:2px 6px;border-radius:6px;background:#2a2208;color:var(--gold2);margin-top:3px}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--card2);color:var(--text);font-size:16px}
.total{display:flex;justify-content:space-between;font-size:16px;font-weight:800;margin:14px 0}
.total span:last-child{color:var(--gold2)}
input,textarea{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:12px;font-size:15px;margin-bottom:10px;font-family:inherit}
input:focus,textarea:focus{outline:1px solid var(--gold)}
label{font-size:12px;color:var(--muted);display:block;margin:0 0 4px 2px}
.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:14px;line-height:1.6}
.empty b{display:block;font-size:42px;margin-bottom:8px}
.order{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13px;line-height:1.5}
.order .st{color:var(--green);font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.show{opacity:1}
.step{display:flex;gap:12px;margin-bottom:12px;align-items:flex-start}
.step i{flex:none;width:26px;height:26px;border-radius:13px;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;font-style:normal;font-weight:800;display:grid;place-items:center;font-size:13px}
.step div{font-size:13px;line-height:1.5;color:#d8d4c4}
.ok{text-align:center;padding:26px 18px 6px}
.ok b{display:block;font-size:44px;margin-bottom:6px}
button,a,select,input,label{touch-action:manipulation;-webkit-tap-highlight-color:transparent}

/* ---- oq (kunduzgi) mavzu ---- */
html[data-theme=light]{--bg:#f4f2ec;--card:#ffffff;--card2:#f0ede5;--line:#dedad0;--gold:#b8901a;--gold2:#8a6a0a;--text:#1b1a17;--muted:#6f6b60;--red:#e5383b;--green:#1f9d6a}
html[data-theme=light] header{background:rgba(255,255,255,.94)}
html[data-theme=light] nav{background:rgba(255,255,255,.97)}
html[data-theme=light] .hero{background:linear-gradient(135deg,#fff3cf,#fbf6e6 60%);border-color:#ead9a0}
html[data-theme=light] .hero p,html[data-theme=light] .step div,html[data-theme=light] [style*="#cfc9b3"],html[data-theme=light] [style*="#d8d4c4"]{color:#4a4638!important}
html[data-theme=light] .chip.on,html[data-theme=light] .tag{background:#fbefc4;color:#6e5206}
html[data-theme=light] .likebtn.on{background:#ffe5e6;border-color:#f0a5a8}
html[data-theme=light] .stars button{color:#c9c5b8}
html[data-theme=light] .stars button.on{color:#d4a017}
html[data-theme=light] .dots i{background:#c9c5b8}
html[data-theme=light] .toast{background:#1b1a17;color:#fff}
html[data-theme=light] .card{box-shadow:0 1px 3px rgba(0,0,0,.06)}
html[data-theme=light] .sheet-bg{background:rgba(0,0,0,.35)}
html[data-theme=light] .seg button.on,html[data-theme=light] .btn,html[data-theme=light] .cb.me{color:#fff}
html[data-theme=light] .btn.ghost{color:var(--text)}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo">qSH</div>
    <div><h1 id="brand">q<span>SHOP</span></h1><small id="tagline">Xitoy tovarlari, guruh bilan arzon</small></div>
    <button class="bell" id="bell" aria-label="Bildirishnomalar"><span>🔔</span><small>Xabarlar</small><em class="bn" id="bellN"></em></button>
    <button class="bell" id="theme" aria-label="Fon rangi" style="margin-left:0"><span id="themeI">🌙</span><small id="themeT">Qora</small></button>
  </header>
  <main id="main"><div class="empty"><b>⏳</b>Yuklanmoqda...</div></main>
  <nav id="nav"></nav>
</div>
<div class="sheet-bg" id="bg"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  'use strict';
  var DEFAULT_SHOP = { name: 'qSHOP', tagline: 'Xitoy tovarlari, guruh bilan arzon', hero_title: "Do'stlar bilan olsangiz — arzonroq",
    hero_text: "Mahsulotni tanlang, guruhga qo'shiling va do'stlaringizni chaqiring. Guruh to'lgach buyurtma Xitoydan yo'lga chiqadi.", admin_telegram: '' };
  var DEFAULT_INFO = { steps: [], note: '' };
  var state = { products: [], shop: DEFAULT_SHOP, info: DEFAULT_INFO, categories: [], pay: {}, coupon: null, ads: {}, help: 'chat', chatMsgs: [], chatLast: 0, chatUnread: 0, chImg: null, stats: {}, liked: {}, anns: [], rv: null, rvStar: 0, rcpt: null, cat: '', q: '', tab: 'home', cart: [], orders: [], loaded: false };
  var sb = null;
  try { if (window.supabase && window.QSHOP && QSHOP.SUPABASE_URL) sb = window.supabase.createClient(QSHOP.SUPABASE_URL, QSHOP.SUPABASE_KEY); } catch(e){}

  function load(k, d){ try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } }
  function save(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function money(n){ return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' ') + " so'm"; }
  function $(id){ return document.getElementById(id); }
  function byId(id){ return state.products.filter(function(p){ return p.id === id; })[0]; }
  function discount(p){ return p.oldPrice > p.price ? Math.round((1 - p.price / p.oldPrice) * 100) : 0; }
  function soloPrice(p){ return p.oldPrice > 0 ? p.oldPrice : p.price; }
  function groupMode(){ return state.shop.group_mode !== false; }
  // Guruh rejimi o'chiq bo'lsa hamma narsa bitta narxda (p.price). Yoqiq bo'lsa: guruh = price, yakka = oldPrice.
  function unitPrice(p, group){ return (groupMode() && !group) ? soloPrice(p) : p.price; }
  var STATUS_TXT = { new: ['Qabul qilindi', 1], confirmed: ['Tasdiqlandi', 2], purchased: ['Xitoydan sotib olindi', 3],
    shipped: ["Yo'lda", 4], arrived: ['Keldi — olib ketishingiz mumkin', 5], done: ['Yakunlandi', 5], cancelled: ['Bekor qilindi', 0] };
  function shipHtml(o){
    var sh = (state.ship && state.ship[o.no]) || 0;
    if (!(sh > 0)) return '<span class="muted">Yuk (kargo): tovar kelgach hisoblanadi</span><br>';
    return 'Yuk (kargo): <b>' + money(sh) + '</b><br>To\'lov jami: <b style="color:var(--gold2)">' + money(+o.total + sh) + '</b><br>';
  }
  function statusHtml(no){
    var s = state.statuses[no] || 'new', t = STATUS_TXT[s] || STATUS_TXT['new'];
    if (s === 'cancelled') return '<span class="st" style="color:var(--red)">' + t[0] + '</span>';
    return '<span class="st">' + t[0] + '</span><div class="bar" style="margin-top:6px"><i style="width:' + (t[1] * 20) + '%"></i></div>';

  function loadImg(file){
    return new Promise(function(resolve, reject){
      function viaReader(){
        var fr = new FileReader();
        fr.onload = function(){ var im = new Image(); im.onload = function(){ resolve(im); }; im.onerror = function(){ reject(new Error('format')); }; im.src = fr.result; };
        fr.onerror = function(){ reject(new Error('format')); };
        fr.readAsDataURL(file);
      }
      if (window.createImageBitmap) {
        createImageBitmap(file).then(resolve).catch(function(){
          var url = URL.createObjectURL(file), im = new Image();
          im.onload = function(){ URL.revokeObjectURL(url); resolve(im); };
          im.onerror = function(){ URL.revokeObjectURL(url); viaReader(); };
          im.src = url;
        });
      } else viaReader();
    });
  }
  async function makeJpeg(file, maxSide, q){
    var img = await loadImg(file);
    var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
    var k = Math.min(1, maxSide / Math.max(w, h));
    var c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w * k)); c.height = Math.max(1, Math.round(h * k));
    var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
    if (img.close) img.close();
    return c.toDataURL('image/jpeg', q);
  }
  async function readReceipt(file){
    var full = await makeJpeg(file, 1100, 0.72);
    if (full.length > 600000) full = await makeJpeg(file, 900, 0.55);
    if (full.length > 650000) full = await makeJpeg(file, 700, 0.5);
    if (full.length > 650000) throw new Error('Rasm juda katta');
    return { full: full, thumb: await makeJpeg(file, 140, 0.6) };
  }

    var was = !!state.liked[id], s = state.stats[id] = state.stats[id] || { likes: 0, reviews: 0, rating: 0 };
    if (was) { delete state.liked[id]; s.likes = Math.max(0, s.likes - 1); } else { state.liked[id] = 1; s.likes++; }
    likeUi(id);
    try {
      var r = await sb.rpc('like_toggle', { p_token: state.token, p_product: id }), d = r.data;
      if (!d || r.error || d.error) throw new Error('x');
      if (d.liked) state.liked[id] = 1; else delete state.liked[id];
      s.likes = +d.count;
    } catch(e){
      if (was) { state.liked[id] = 1; s.likes++; } else { delete state.liked[id]; s.likes = Math.max(0, s.likes - 1); }
      toast('Bajarilmadi, qayta urinib ko\'ring');
    }
    likeUi(id);
  }
  async function loadStats(){
    if (!sb) return;
    try {
      var r = await sb.rpc('product_stats');
      if (!r.error && r.data) { var m = {}; r.data.forEach(function(x){ m[x.product_id] = { likes: +x.likes, reviews: +x.reviews, rating: +x.rating }; }); state.stats = m; }
      if (state.token) { var l = await sb.rpc('my_likes', { p_token: state.token }); if (!l.error && Array.isArray(l.data)) { state.liked = {}; l.data.forEach(function(i){ state.liked[i] = 1; }); } }
    } catch(e){}
    var el = $('plist'); if (el && state.tab === 'home') { el.innerHTML = listHtml(); adBind(); }
    chipsRefresh();
  }

  function chipsRefresh(){
    if (state.tab !== 'home' || !$('s_q')) return;
    var tmp = document.createElement('div'); tmp.innerHTML = toolbarHtml();
    var neu = tmp.querySelector('.chips'), old = document.querySelector('main .chips');
    if (old && neu) old.outerHTML = neu.outerHTML; else if (old && !neu) old.remove(); else if (!old && neu) $('s_q').insertAdjacentHTML('afterend', neu.outerHTML);
  }

  /* --- Sharhlar --- */
  function starsTxt(n){ return '★★★★★'.slice(0, n) + '☆☆☆☆☆'.slice(0, 5 - n); }
  function reviewsHtml(){
    var rv = state.rv, list = rv.list, h = '<h2>⭐ Sharhlar' + (list.length ? ' <span class="muted" style="font-size:13px;font-weight:600">· ' + (list.reduce(function(a, x){ return a + x.rating; }, 0) / list.length).toFixed(1) + ' (' + list.length + ')</span>' : '') + '</h2>';
    if (!state.me) h += '<p class="hint" style="margin-top:0">Sharh yozish uchun avval kiring (Profil bo\'limi).</p>';
    else {
      h += '<div class="card" style="padding:12px"><b style="font-size:14px">' + (rv.mine ? 'Sizning sharhingiz' : 'Fikringizni yozing') + '</b>' +
        '<div class="stars" id="rv_stars">' + [1, 2, 3, 4, 5].map(function(n){ return '<button data-star="' + n + '" class="' + (n <= state.rvStar ? 'on' : '') + '">★</button>'; }).join('') + '</div>' +
        '<textarea id="rv_txt" rows="3" maxlength="600" placeholder="Mahsulot qanday? (ixtiyoriy)">' + esc(rv.mine ? rv.mine.body : '') + '</textarea>' +
        (rv.mine && rv.mine.hidden ? '<div class="muted" style="margin:4px 0">Sharhingiz do\'kon tomonidan yashirilgan.</div>' : '') +
        '<div class="row" style="gap:8px;margin-top:8px"><button class="btn" id="rv_save">' + (rv.mine ? 'Yangilash' : 'Yuborish') + '</button>' + (rv.mine ? '<button class="btn ghost" id="rv_del" style="width:auto">O\'chirish</button>' : '') + '</div></div>';
    }
    if (!list.length) return h + '<p class="hint">Hali sharh yo\'q. Birinchi bo\'ling!</p>';
    return h + list.map(function(x){
      var d = new Date(x.created_at);
      return '<div class="rv"><div class="rh"><span><b>' + esc(x.name) + '</b>' + (x.mine ? ' <span class="muted">(siz)</span>' : '') + (x.bought ? '<span class="rb">✅ Xarid qilgan</span>' : '') + '</span><span class="muted" style="font-size:11px">' + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + '</span></div>' +
        '<div class="ry">' + starsTxt(x.rating) + '</div>' + (x.body ? '<div style="white-space:pre-wrap;word-break:break-word">' + esc(x.body) + '</div>' : '') +
        (x.reply ? '<div class="rr">🏪 <b>Do\'kon javobi:</b> ' + esc(x.reply) + '</div>' : '') + '</div>';
    }).join('');
  }
  async function loadReviews(pid){
    var box = $('rv_box'); if (!box || !sb) return;
    var d = null;
    try { var r = await sb.rpc('reviews_list', { p_product: pid, p_token: state.token || null }); if (!r.error) d = r.data; } catch(e){}
    box = $('rv_box'); if (!box || String(box.dataset.pid) !== String(pid)) return;
    if (!d) { box.innerHTML = ''; return; }
    state.rv = { pid: pid, list: d.list || [], mine: d.mine || null }; state.rvStar = state.rv.mine ? state.rv.mine.rating : 0;
    box.innerHTML = reviewsHtml();
  }
  async function saveReview(){
    var pid = state.rv && state.rv.pid; if (!pid) return;
    if (!(state.rvStar >= 1)) { toast('Avval yulduzchani tanlang'); return; }
    var btn = $('rv_save'); btn.disabled = true;
    var r; try { r = await sb.rpc('review_save', { p_token: state.token, p_product: pid, p_rating: state.rvStar, p_body: $('rv_txt').value.trim() }); } catch(e){ r = null; }
    btn.disabled = false;
    var d = r && r.data;
    if (!d || r.error) { toast('Saqlanmadi. Internetni tekshiring'); return; }
    if (d.error) { if (d.error === 'session') { clearSession(); toast('Seans tugagan. Qayta kiring'); return; } toast(d.error); return; }
    toast('Sharhingiz saqlandi ✅'); loadReviews(pid); loadStats();
  }
  async function delReview(){
    var pid = state.rv && state.rv.pid; if (!pid || !confirm('Sharhingiz o\'chirilsinmi?')) return;
    try { await sb.rpc('review_delete', { p_token: state.token, p_product: pid }); } catch(e){}
    toast('Sharh o\'chirildi'); loadReviews(pid); loadStats();
  }

  /* --- Bildirishnomalar (hammaga xabar) --- */
  function annUnseen(){
    var seen = +load('qs_annseen', 0) || 0, lim = Date.now() - 30 * 864e5;
    return state.anns.filter(function(a){ return a.id > seen && new Date(a.created_at).getTime() > lim; });
  }
  function bellUpdate(){ var n = annUnseen().length, el = $('bellN'); if (el) { el.textContent = n > 9 ? '9+' : n; el.style.display = n ? 'grid' : 'none'; } }
  function annHtml(a, isNew){
    var mu = safeMedia(a.media_url), media = '';
    if (mu && a.media_type === 'image') media = '<img class="am" data-annzoom="' + esc(mu) + '" src="' + esc(mu) + '" alt="">';
    else if (mu && a.media_type === 'video') media = '<video class="am" src="' + esc(mu) + '" controls playsinline preload="metadata"></video>';
    var l = safeLink(a.link), d = new Date(a.created_at);
    return '<div class="annc' + (isNew ? ' new' : '') + '">' + (isNew ? '<span class="tag" style="background:var(--red);color:#fff;margin-bottom:6px;display:inline-block">YANGI</span>' : '') +
      (a.title ? '<div class="at">' + esc(a.title) + '</div>' : '') + media + (a.body ? '<div class="ab">' + autolink(a.body) + '</div>' : '') +
      (l ? '<a class="btn" target="_blank" rel="noopener noreferrer" href="' + esc(l) + '">Batafsil →</a>' : '') +
      '<div class="muted" style="font-size:11px;margin-top:8px">' + p2(d.getDate()) + '.' + p2(d.getMonth() + 1) + '.' + d.getFullYear() + ' ' + fmtTime(a.created_at) + '</div></div>';
  }
  function openAnns(){
    var newIds = annUnseen().map(function(a){ return a.id; });
    $('sheet').innerHTML = '<button class="close" id="x">✕</button><div class="body"><h2 style="margin:0 0 12px">🔔 Bildirishnomalar</h2>' +
      (state.anns.length ? state.anns.map(function(a){ return annHtml(a, newIds.indexOf(a.id) >= 0); }).join('') : '<div class="empty"><b>🔔</b>Hozircha xabar yo\'q</div>') + '</div>';
    $('bg').classList.add('show'); $('sheet').classList.add('show'); $('sheet').scrollTop = 0;
    var mx = 0; state.anns.forEach(function(a){ if (a.id > mx) mx = a.id; }); save('qs_annseen', mx); bellUpdate();
  }
  async function loadAnns(){
    if (!sb) return;
    try { var r = await sb.from('announcements').select('*').order('id', { ascending: false }).limit(30); if (!r.error && r.data) { state.anns = r.data; save('qs_anns', r.data); } } catch(e){}
    bellUpdate();
    if (!state.annPopped && !$('sheet').classList.contains('show')) {
      var a = annUnseen().filter(function(x){ return x.popup && Date.now() - new Date(x.created_at).getTime() < 3 * 864e5; })[0];
      if (a) { state.annPopped = true; openAnns(); }
    }
  }

  function themeApply(){
    var l = document.documentElement.getAttribute('data-theme') === 'light';
    var m = document.getElementById('themeMeta'); if (m) m.setAttribute('content', l ? '#f4f2ec' : '#0e0e10');
    var i = document.getElementById('themeI'), t = document.getElementById('themeT');
    if (i) i.textContent = l ? '☀️' : '🌙'; if (t) t.textContent = l ? 'Oq' : 'Qora';
  }
  function toggleTheme(){
    var l = document.documentElement.getAttribute('data-theme') === 'light';
    if (l) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'light');
    try { localStorage.setItem('qs_theme', l ? 'dark' : 'light'); } catch(e){}
    themeApply();
  }
  themeApply();
  document.addEventListener('click', function(e){
    var t = e.target.closest && e.target.closest('[data-chretry],[data-chdrop],#theme,#bell,[data-help],[data-like],[data-star],#rv_save,#rv_del,#ch_send,[data-chzoom],[data-chrm],[data-annzoom]');
    if (!t) return;
    if (t.dataset.chretry || t.dataset.chdrop) {
      e.preventDefault(); var kk = t.dataset.chretry || t.dataset.chdrop, mm = (state.chatPend || []).filter(function(x){ return x.k === kk; })[0];
      if (mm && t.dataset.chretry) { mm.err = false; chatRedraw(true); chatPush(mm); }
      else if (mm) { state.chatPend = state.chatPend.filter(function(x){ return x !== mm; }); chatRedraw(false); }
    }
    else if (t.id === 'theme') toggleTheme();
    else if (t.id === 'bell') openAnns();
    else if (t.dataset.help) { state.help = t.dataset.help; render(); }
    else if (t.dataset.like) toggleLike(+t.dataset.like);
    else if (t.dataset.star) { state.rvStar = +t.dataset.star; Array.prototype.forEach.call(document.querySelectorAll('#rv_stars button'), function(b){ b.classList.toggle('on', +b.dataset.star <= state.rvStar); }); }
    else if (t.id === 'rv_save') saveReview();
    else if (t.id === 'rv_del') delReview();
    else if (t.id === 'ch_send') chatSend();
    else if (t.dataset.chrm) { state.chImg = null; var pv = $('chimgprev'); if (pv) pv.innerHTML = ''; }
    else if (t.dataset.chzoom) { var m = state.chatMsgs.filter(function(x){ return String(x.id) === t.dataset.chzoom; })[0]; if (m) showImgs([m.media_url], 0, false); }
    else if (t.dataset.annzoom) showImgs([t.dataset.annzoom], 0, false);
  });
  document.addEventListener('change', function(e){
    var t = e.target; if (t && t.id === 'ch_file' && t.files && t.files[0]) { var f = t.files[0]; t.value = ''; chatPickImg(f); }
  });
  document.addEventListener('input', function(e){
    var t = e.target; if (t && t.id === 'ch_in') { t.style.height = 'auto'; t.style.height = Math.min(110, t.scrollHeight) + 'px'; }
  });

  async function init(){
    state.cart = load('qs_cart', []); state.orders = load('qs_orders', []); state.statuses = load('qs_status', {}); state.ship = load('qs_ship', {});
    state.token = load('qs_token', ''); state.me = state.token ? load('qs_me', null) : null; state.pmode = 'login';
    var ok = await loadData();
    if (!ok) { $('main').innerHTML = '<div class="empty"><b>📡</b>Mahsulotlar yuklanmadi.<br>Internetni tekshirib, qayta urinib ko\'ring.</div>'; renderNav(); }
    else {
      render();
      checkSession();
      refreshStatuses();
      state.anns = load('qs_anns', []); bellUpdate(); loadAnns(); loadStats(); chatUnreadPoll();
      setInterval(chatUnreadPoll, 30000); setInterval(function(){ if (!document.hidden) loadAnns(); }, 90000);
      var q = new URLSearchParams(location.search).get('p');
      if (q) openProduct(+q);
    }
    document.addEventListener('visibilitychange', function(){ if (!document.hidden) { refreshStatuses(); loadAnns(); loadStats(); chatUnreadPoll(); } if (!document.hidden && state.tab === 'home') loadData().then(function(){ if (state.tab === 'home') render(); }); });
    if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function(){});
  }
  init();
})();
</script>
</body>
